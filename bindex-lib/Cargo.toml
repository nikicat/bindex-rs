[package]
name = "bindex"
version = "0.1.2"
edition = "2021"
authors = ["Roman Zeyde <me@romanzey.de>"]
description = "Bitcoin indexing library in Rust"
license = "MIT"
homepage = "https://github.com/romanz/bindex-rs"
repository = "https://github.com/romanz/bindex-rs"
keywords = ["bitcoin", "index", "database"]
documentation = "https://docs.rs/bindex/"
readme = "../README.md"

[features]
cache = ["dep:rusqlite"]
bitcoin_serde = ["bitcoin/serde"]

[dependencies]
bitcoin = { version = "0.32", default-features = false }
# sha2 feature: txid_sha2() via the RustCrypto sha2 crate, which uses the
# CPU's SHA2 instructions (aarch64 crypto extensions / x86 SHA-NI) —
# bitcoin_hashes computes SHA256 in portable software and dominates the
# initial-sync profile (~72% of CPU on a Cortex-A76)
bitcoin_slices = { version = "0.11", features = ["bitcoin", "sha2"] }
sha2 = "0.10"
log = "0.4"
serde = { version = "1.0", default-features = false, features = ["serde_derive"] }
serde_json = "1.0"
thiserror = "2.0"
ureq = { version = "3", default-features = false }
rayon = "1.12"
rusqlite = { version = "0.37", optional = true }

# Current Debian stable is using RocksDB 9.10.0 (https://packages.debian.org/trixie/librocksdb-dev)
rust-rocksdb = { version = "0.36.0", default-features = false, features = ["zstd"] }

[dev-dependencies]
hex_lit = "0.1"
# bitcoind path should be specified via BITCOIND_EXE
corepc-node = { version = "0.12", default-features = false, features = ["30_0"] }
tempfile = "3"
